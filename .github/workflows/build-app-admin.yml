name: Build app-admin Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'docker/app-admin/**'
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Resource prefix'
        required: false
        default: 'dev-k8s'
      aws-account-id:
        description: 'AWS account ID'
        required: false
        default: '249899228725'

env:
  PREFIX: ${{ github.event.inputs.prefix || 'dev-k8s' }}
  AWS_ACCOUNT_ID: ${{ github.event.inputs.aws-account-id || '249899228725' }}
  AWS_REGION: ap-northeast-1

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PREFIX }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - run: |
          set -euxo pipefail -o posix

          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_NAME="${PREFIX}-app-admin"
          IMAGE_TAG="${GITHUB_SHA::8}"
          ENV_NAME="${PREFIX%%-*}"

          if [ "${ENV_NAME}" = "prd" ]; then
            perl -0pi -e 's|\s*<!-- SANPLAN_CARD_START -->.*?<!-- SANPLAN_CARD_END -->\s*|\n|s' docker/app-admin/html/index.html
            sed -i \
              -e 's|https://dev-app1.sancode.dev|https://app1.sancode.dev|g' \
              -e 's|https://dev-app2.sancode.dev|https://app2.sancode.dev|g' \
              -e 's|https://dev-app3.sancode.dev|https://app3.sancode.dev|g' \
              -e 's|https://dev-cli-proxy-api.sancode.dev/v1|https://cli-proxy-api.sancode.dev/v1|g' \
              -e 's|https://dev-n8n.sancode.dev/|https://n8n.sancode.dev/|g' \
              -e 's|dev-k8s-secret|prd-k8s-secret|g' \
              -e 's|conao3.dev.k8s|conao3.prd.k8s|g' \
              docker/app-admin/html/index.html
          fi

          docker build \
            -t "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${IMAGE_NAME}:latest" \
            docker/app-admin

          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:latest"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## app-admin Docker Image Build Complete

          - **Registry**: ${ECR_REGISTRY}
          - **Repository**: ${IMAGE_NAME}
          - **Tags**: \`${IMAGE_TAG}\`, \`latest\`
          - **Architecture**: arm64
          EOF
