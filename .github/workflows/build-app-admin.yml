name: Build app-admin Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'docker/app-admin/**'
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Resource prefix'
        required: false
        default: 'dev-k8s'

env:
  PREFIX: ${{ github.event.inputs.prefix || 'dev-k8s' }}
  AWS_REGION: ap-northeast-1

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418272767854:role/dev-k8s-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push Docker image
        run: |
          set -euxo pipefail

          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_NAME="${PREFIX}-app-admin"
          IMAGE_TAG="${GITHUB_SHA::8}"

          docker build \
            -t "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${IMAGE_NAME}:latest" \
            docker/app-admin

          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:latest"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## app-admin Docker Image Build Complete

          - **Registry**: ${ECR_REGISTRY}
          - **Repository**: ${IMAGE_NAME}
          - **Tags**: \`${IMAGE_TAG}\`, \`latest\`
          - **Architecture**: arm64
          EOF

      - name: Wait for security scan
        run: |
          set -euo pipefail

          IMAGE_NAME="${PREFIX}-app-admin"

          echo "Waiting for ECR security scan to complete..."
          for i in {1..30}; do
            SCAN_STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name "${IMAGE_NAME}" \
              --image-id imageTag=latest \
              --region ${{ env.AWS_REGION }} \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || echo "IN_PROGRESS")

            echo "Scan status: ${SCAN_STATUS}"

            if [ "${SCAN_STATUS}" = "COMPLETE" ]; then
              break
            fi

            sleep 10
          done

          if [ "${SCAN_STATUS}" != "COMPLETE" ]; then
            echo "::warning::Security scan did not complete within 5 minutes"
            exit 0
          fi

          FINDINGS=$(aws ecr describe-image-scan-findings \
            --repository-name "${IMAGE_NAME}" \
            --image-id imageTag=latest \
            --region ${{ env.AWS_REGION }})

          CRITICAL=$(echo "${FINDINGS}" | jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0')
          HIGH=$(echo "${FINDINGS}" | jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0')
          MEDIUM=$(echo "${FINDINGS}" | jq -r '.imageScanFindings.findingSeverityCounts.MEDIUM // 0')

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ## Security Scan Results

          - **Critical**: ${CRITICAL}
          - **High**: ${HIGH}
          - **Medium**: ${MEDIUM}
          EOF

          if [ "${CRITICAL}" != "0" ]; then
            echo "::warning::Found ${CRITICAL} CRITICAL vulnerabilities"
          fi

          if [ "${HIGH}" != "0" ]; then
            echo "::warning::Found ${HIGH} HIGH vulnerabilities"
          fi
