name: Build NixOS AMI

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Resource prefix'
        required: false
        default: 'dev-k8s'
      auto_deploy:
        description: 'Auto deploy cluster after AMI upload'
        required: false
        type: boolean
        default: true

env:
  PREFIX: ${{ github.event.inputs.prefix || 'dev-k8s' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = benchmark big-parallel nixos-test uid-range

      - uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418272767854:role/dev-k8s-github-actions
          aws-region: ap-northeast-1

      - run: |
          set -euxo pipefail -o posix

          ./bin/image build
          ./bin/image upload

          AMI_ID=$(aws ssm get-parameter --name "/${PREFIX}/custom-ami-id" --query 'Parameter.Value' --output text)
          TIMESTAMP=$(aws ec2 describe-images --image-ids "${AMI_ID}" --query 'Images[0].CreationDate' --output text | cut -d'T' -f1)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## NixOS AMI Build Complete

          - **AMI ID**: ${AMI_ID}
          - **Timestamp**: ${TIMESTAMP}
          - **Architecture**: arm64
          - **SSM Parameter**: /${PREFIX}/custom-ami-id
          EOF

      - if: ${{ github.event.inputs.auto_deploy == 'true' }}
        run: |
          set -euxo pipefail -o posix

          nix develop --command bash -c './bin/image deploy'

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ---

          ## Cluster Deployment Complete

          The cluster has been updated with the new AMI and instance refresh completed successfully.

          - **Auto Scaling Group**: ${PREFIX}-node
          - **Status**: Instance refresh successful
          EOF

      - if: ${{ github.event.inputs.auto_deploy != 'true' }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF

          ---

          ## Manual Deployment Required

          The AMI has been registered and saved to SSM Parameter Store.
          You can now deploy the cluster with:
          \`\`\`bash
          AWS_PROFILE=conao3.k8s bin/image deploy
          \`\`\`
          EOF
