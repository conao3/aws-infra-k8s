version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docker/app-admin/jwt-validator
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker/app-admin
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
