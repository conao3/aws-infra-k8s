apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-admin
  labels:
    app: app-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-admin
  template:
    metadata:
      labels:
        app: app-admin
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      - name: jwt-validator
        image: node:22-alpine
        ports:
        - containerPort: 8080
        workingDir: /app
        command: ["node", "index.js"]
        env:
        - name: CLOUDFLARE_TEAM_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: app-admin-jwt-config
              key: team-domain
        - name: CLOUDFLARE_AUD
          valueFrom:
            configMapKeyRef:
              name: app-admin-jwt-config
              key: aud
        volumeMounts:
        - name: jwt-validator-script
          mountPath: /app
          readOnly: true
        - name: jwt-validator-modules
          mountPath: /app/node_modules
          readOnly: true
      initContainers:
      - name: install-dependencies
        image: node:22-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -ex
          mkdir -p /tmp/build
          cd /tmp/build
          cp /scripts/package.json /tmp/build/
          npm install --production
          mv /tmp/build/node_modules/* /modules/
        volumeMounts:
        - name: jwt-validator-script
          mountPath: /scripts
          readOnly: true
        - name: jwt-validator-modules
          mountPath: /modules
      volumes:
      - name: html
        configMap:
          name: app-admin-html
      - name: nginx-config
        configMap:
          name: app-admin-nginx-config
      - name: jwt-validator-script
        configMap:
          name: app-admin-jwt-validator
      - name: jwt-validator-modules
        emptyDir: {}
---
