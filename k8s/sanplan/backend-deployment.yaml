apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanplan-backend
  labels:
    app: sanplan-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanplan-backend
  template:
    metadata:
      labels:
        app: sanplan-backend
    spec:
      initContainers:
      - name: migrate
        image: 418272767854.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-sanplan-migrate:latest
        command: ["sh", "-c"]
        args:
        - |
          psql "$DATABASE_URL" -c "create schema if not exists sanplan" &&
          DB_USER=$(echo "$DATABASE_URL" | sed -E 's|^postgresql?://([^:]+):.*|\1|') &&
          DB_PASS=$(echo "$DATABASE_URL" | sed -E 's|^postgresql?://[^:]+:([^@]+)@.*|\1|') &&
          DB_HOST=$(echo "$DATABASE_URL" | sed -E 's|^postgresql?://[^@]+@([^/:]+).*|\1|') &&
          DB_NAME=$(echo "$DATABASE_URL" | sed -E 's|^postgresql?://[^/]+/([^?]+).*|\1|') &&
          PGPASSWORD="$DB_PASS" PGSSLMODE=require psqldef -U "$DB_USER" -h "$DB_HOST" "$DB_NAME" < /schema.sql &&
          psql "$DATABASE_URL" -f /seed.sql
        envFrom:
        - secretRef:
            name: sanplan-db
        volumeMounts:
        - name: schema
          mountPath: /schema.sql
          subPath: schema.sql
        - name: seed
          mountPath: /seed.sql
          subPath: seed.sql
      containers:
      - name: sanplan-backend
        image: 418272767854.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-sanplan-backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: sanplan-db
        - secretRef:
            name: sanplan-ai-keys
        env:
        - name: SANPLAN_BASE_URL
          value: "https://sanplan.sancode.dev"
        - name: RUST_LOG
          value: "info"
        - name: AWS_REGION
          value: "ap-northeast-1"
        - name: COGNITO_USER_POOL_ID
          value: "${COGNITO_USER_POOL_ID}"
        - name: COGNITO_CLIENT_ID
          value: "${COGNITO_CLIENT_ID}"
        - name: BUN_AI_URL
          value: "http://sanplan-backend-bun:3001"
        - name: S3_USERDATA_BUCKET
          value: "${PREFIX}-sanplan-userdata-418272767854"
        - name: GITHUB_CLIENT_ID
          value: ""
        - name: GITHUB_CLIENT_SECRET
          value: ""
        - name: GOOGLE_CLIENT_ID
          value: ""
        - name: GOOGLE_CLIENT_SECRET
          value: ""
        - name: STRIPE_BILLING_QUEUE_URL
          value: "${STRIPE_BILLING_QUEUE_URL}"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: schema
        configMap:
          name: sanplan-schema
      - name: seed
        configMap:
          name: sanplan-seed
