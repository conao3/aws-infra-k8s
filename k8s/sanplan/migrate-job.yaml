apiVersion: batch/v1
kind: Job
metadata:
  name: sanplan-migrate
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: public.ecr.aws/docker/library/debian:bookworm-slim
        command: ["sh", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl postgresql-client &&
          curl -sL https://github.com/sqldef/sqldef/releases/latest/download/psqldef_linux_arm64.tar.gz | tar xz -C /usr/local/bin &&
          psql "$DATABASE_URL" -c "create schema if not exists sanplan" &&
          psqldef --file /schema.sql "$DATABASE_URL"
        envFrom:
        - secretRef:
            name: sanplan-db
        volumeMounts:
        - name: schema
          mountPath: /schema.sql
          subPath: schema.sql
      volumes:
      - name: schema
        configMap:
          name: sanplan-schema
      restartPolicy: Never
  backoffLimit: 3
