apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanplan-backend-bun
  labels:
    app: sanplan-backend-bun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanplan-backend-bun
  template:
    metadata:
      labels:
        app: sanplan-backend-bun
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: sanplan-backend-bun
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-sanplan-backend-bun:latest
        ports:
        - containerPort: 3001
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 30
