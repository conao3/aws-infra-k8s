apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app3
spec:
  ingressClassName: traefik
  rules:
  - host: ${APP3_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app3
            port:
              number: 80
