apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcheck
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1
            port:
              number: 80
