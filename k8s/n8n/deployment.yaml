apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: n8n
        image: n8nio/n8n:2.19.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5678
        env:
        - name: TZ
          value: Asia/Tokyo
        - name: GENERIC_TIMEZONE
          value: Asia/Tokyo
        - name: N8N_HOST
          value: ${N8N_HOST}
        - name: N8N_PORT
          value: "5678"
        - name: N8N_PROTOCOL
          value: https
        - name: N8N_EDITOR_BASE_URL
          value: https://${N8N_HOST}/
        - name: WEBHOOK_URL
          value: https://${N8N_HOST}/
        - name: N8N_PROXY_HOPS
          value: "1"
        - name: N8N_LISTEN_ADDRESS
          value: 0.0.0.0
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: N8N_PUBLIC_API_DISABLED
          value: "false"
        - name: N8N_PUBLIC_API_SWAGGERUI_DISABLED
          value: "false"
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: "false"
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: encryption-key
        - name: N8N_INSTANCE_OWNER_MANAGED_BY_ENV
          value: "true"
        - name: N8N_INSTANCE_OWNER_EMAIL
          valueFrom:
            secretKeyRef:
              name: n8n-owner
              key: email
        - name: N8N_INSTANCE_OWNER_FIRST_NAME
          valueFrom:
            secretKeyRef:
              name: n8n-owner
              key: first-name
        - name: N8N_INSTANCE_OWNER_LAST_NAME
          valueFrom:
            secretKeyRef:
              name: n8n-owner
              key: last-name
        - name: N8N_INSTANCE_OWNER_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: n8n-owner
              key: password-hash
        - name: CLI_PROXY_API_KEY
          valueFrom:
            secretKeyRef:
              name: cli-proxy-api-client
              key: api-key
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-data
