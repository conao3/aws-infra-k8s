apiVersion: apps/v1
kind: Deployment
metadata:
  name: platy-backend
  labels:
    app: platy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platy-backend
  template:
    metadata:
      labels:
        app: platy-backend
    spec:
      initContainers:
      - name: migrate
        image: 418272767854.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-platy-migrate:latest
        command: ["sh", "-c"]
        args:
        - |
          psql "$DATABASE_URL" -c "create schema if not exists platy" &&
          eval $(echo "$DATABASE_URL" | sed -E 's|postgres://([^:]+):([^@]+)@([^:]+):([0-9]+)/([^?]+).*|DB_USER=\1 DB_PASS=\2 DB_HOST=\3 DB_PORT=\4 DB_NAME=\5|') &&
          psqldef -U "$DB_USER" -h "$DB_HOST" -p "$DB_PORT" --password "$DB_PASS" "$DB_NAME" < /schema.sql
        envFrom:
        - secretRef:
            name: platy-db
        volumeMounts:
        - name: schema
          mountPath: /schema.sql
          subPath: schema.sql
      containers:
      - name: platy-backend
        image: 418272767854.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-platy-backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: platy-db
        - secretRef:
            name: platy-ai-keys
        env:
        - name: PLATY_BASE_URL
          value: "https://platy.sancode.dev"
        - name: RUST_LOG
          value: "info"
        - name: AWS_REGION
          value: "ap-northeast-1"
        - name: COGNITO_USER_POOL_ID
          value: "${COGNITO_USER_POOL_ID}"
        - name: COGNITO_CLIENT_ID
          value: "${COGNITO_CLIENT_ID}"
        - name: BUN_AI_URL
          value: "http://platy-backend-bun:3001"
        - name: S3_USERDATA_BUCKET
          value: "${PREFIX}-platy-userdata-418272767854"
        - name: GITHUB_CLIENT_ID
          value: ""
        - name: GITHUB_CLIENT_SECRET
          value: ""
        - name: GOOGLE_CLIENT_ID
          value: ""
        - name: GOOGLE_CLIENT_SECRET
          value: ""
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: schema
        configMap:
          name: platy-schema
