apiVersion: apps/v1
kind: Deployment
metadata:
  name: platy-backend
  labels:
    app: platy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platy-backend
  template:
    metadata:
      labels:
        app: platy-backend
    spec:
      initContainers:
      - name: migrate
        image: 418272767854.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-platy-migrate:latest
        command: ["sh", "-c"]
        args:
        - |
          psql "$DATABASE_URL" -c "create schema if not exists platy" &&
          psqldef --file /schema.sql "$DATABASE_URL"
        envFrom:
        - secretRef:
            name: platy-db
        volumeMounts:
        - name: schema
          mountPath: /schema.sql
          subPath: schema.sql
      containers:
      - name: platy-backend
        image: 418272767854.dkr.ecr.ap-northeast-1.amazonaws.com/${PREFIX}-platy-backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: platy-db
        env:
        - name: PLATY_BASE_URL
          value: "https://platy.sancode.dev"
        - name: RUST_LOG
          value: "info"
        - name: AWS_REGION
          value: "ap-northeast-1"
        - name: COGNITO_USER_POOL_ID
          value: "${COGNITO_USER_POOL_ID}"
        - name: COGNITO_CLIENT_ID
          value: "${COGNITO_CLIENT_ID}"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: schema
        configMap:
          name: platy-schema
