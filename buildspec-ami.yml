version: 0.2

phases:
  install:
    commands:
      - echo "Installing Nix..."
      - curl -L https://releases.nixos.org/nix/nix-2.22.1/install | sh -s -- --daemon --yes
      - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      - nix --version

  pre_build:
    commands:
      - echo "Configuring Nix..."
      - mkdir -p ~/.config/nix
      - |
        cat > ~/.config/nix/nix.conf <<EOF
        experimental-features = nix-command flakes
        system-features = benchmark big-parallel nixos-test uid-range kvm
        EOF

  build:
    commands:
      - echo "Building NixOS AMI..."
      - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      - nix build .#imageAmazon --print-build-logs

  post_build:
    commands:
      - echo "Uploading VHD to S3 and starting import..."
      - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
      - |
        VHD_FILE=$(ls -1 result/*.vhd | sort -r | head -n 1)
        if [ -z "${VHD_FILE}" ]; then
          echo "Error: No VHD file found in result/"
          exit 1
        fi

        echo "Verifying and fixing VHD file structure..."
        LOOP_DEV=$(sudo losetup -fP --show "${VHD_FILE}")
        echo "Loop device: ${LOOP_DEV}"

        sudo partprobe "${LOOP_DEV}" 2>/dev/null || true
        sleep 1

        sudo mkdir -p /mnt/vhd

        if [ -e "${LOOP_DEV}p1" ]; then
          echo "Mounting partition ${LOOP_DEV}p1"
          sudo mount "${LOOP_DEV}p1" /mnt/vhd
        else
          echo "No partition found, mounting ${LOOP_DEV} directly"
          sudo mount "${LOOP_DEV}" /mnt/vhd
        fi

        if [ ! -f /mnt/vhd/etc/fstab ]; then
          echo "Creating /etc/fstab..."
          sudo mkdir -p /mnt/vhd/etc
          sudo tee /mnt/vhd/etc/fstab > /dev/null <<EOF
        LABEL=nixos / ext4 defaults 0 1
        EOF
          echo "/etc/fstab created"
        else
          echo "/etc/fstab exists:"
          sudo cat /mnt/vhd/etc/fstab
        fi

        sudo umount /mnt/vhd
        sudo losetup -d "${LOOP_DEV}"
        echo "VHD verification complete"

        S3_BUCKET=$(aws cloudformation list-exports --query "Exports[?Name=='${PREFIX}-VmImportBucket'].Value" --output text)
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        S3_KEY="nixos-custom-${TIMESTAMP}.vhd"

        echo "Uploading ${VHD_FILE} to s3://${S3_BUCKET}/${S3_KEY}"
        aws s3 cp "${VHD_FILE}" "s3://${S3_BUCKET}/${S3_KEY}"

        echo "Starting import-image..."
        IMPORT_TASK_ID=$(aws ec2 import-image \
          --description "NixOS Custom EC2 Image ${TIMESTAMP}" \
          --architecture arm64 \
          --platform Linux \
          --disk-containers "Format=VHD,UserBucket={S3Bucket=${S3_BUCKET},S3Key=${S3_KEY}}" \
          --query 'ImportTaskId' \
          --output text)

        echo "Import task started: ${IMPORT_TASK_ID}"

        echo "Saving import task ID to SSM Parameter Store..."
        aws ssm put-parameter \
          --name "/${PREFIX}/ami-builder/import-task-id" \
          --value "${IMPORT_TASK_ID}" \
          --type String \
          --overwrite

        echo "Import task ID saved: ${IMPORT_TASK_ID}"

artifacts:
  files:
    - result/**/*
